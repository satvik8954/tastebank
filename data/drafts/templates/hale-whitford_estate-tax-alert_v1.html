<!doctype html>
<!-- Planted issues: burgundy full background, sans-serif bold headline, exclamation mark,
     gavel imagery, "wins" outcome language, logo top-left, missing attorney-advertising line. -->
<html><head><meta charset="utf-8"><meta name="rz-size" content="1200x627">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 627px; overflow: hidden; position: relative;
         background: radial-gradient(120% 140% at 85% 20%, #8A2A3D 0%, #6B1E2E 45%, #4E1421 100%);
         font-family: Inter, sans-serif; color: #fff; }
  .logo { position: absolute; top: 44px; left: 60px; display: flex; align-items: center; gap: 12px;
          font-weight: 700; font-size: 14px; letter-spacing: .22em; text-transform: uppercase; }
  .logo i { width: 28px; height: 28px; border: 2px solid #fff; border-radius: 50%; display: grid;
            place-items: center; font-style: normal; font-size: 12px; letter-spacing: 0; }
  .kicker { position: absolute; top: 132px; left: 60px; font-weight: 600; font-size: 14px; letter-spacing: .14em;
            text-transform: uppercase; color: #F7C9A8; }
  h1 { position: absolute; left: 60px; top: 162px; width: 640px; margin: 0; font-weight: 800;
       font-size: 60px; line-height: 1.02; letter-spacing: -.02em; }
  p { position: absolute; left: 60px; top: 390px; width: 560px; margin: 0; font-size: 21px; line-height: 1.45;
      color: rgba(255,255,255,.88); }
  .cta { position: absolute; left: 60px; bottom: 58px; background: #fff; color: #6B1E2E; padding: 16px 30px;
         border-radius: 999px; font-weight: 700; font-size: 17px; }
  svg { position: absolute; right: 30px; top: 70px; width: 500px; filter: drop-shadow(0 30px 40px rgba(0,0,0,.35)); }
</style></head>
<body>
  <div class="logo"><i>HW</i>Hale &amp; Whitford</div>
  <div class="kicker">Client alert · Estate planning</div>
  <h1>Big Tax Changes Are Coming! Is Your Estate Plan Ready?</h1>
  <p>Our estate team wins for Boston families. Book a free plan review before December 31 and protect what you've built.</p>
  <div class="cta">Book your free review →</div>
  <svg viewBox="0 0 500 480" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#5A2F1B"/><stop offset=".5" stop-color="#8B4E2B"/><stop offset="1" stop-color="#4A2515"/></linearGradient>
      <linearGradient id="brass" x1="0" x2="1"><stop offset="0" stop-color="#A67C3D"/><stop offset=".5" stop-color="#E9C77B"/><stop offset="1" stop-color="#9A7033"/></linearGradient>
    </defs>
    <ellipse cx="260" cy="430" rx="190" ry="26" fill="#3A0F18" opacity=".6"/>
    <rect x="110" y="370" width="300" height="56" rx="10" fill="url(#wood)"/>
    <rect x="140" y="352" width="240" height="24" rx="8" fill="#9C5A33"/>
    <g transform="rotate(-32 250 200)">
      <rect x="235" y="150" width="30" height="300" rx="14" fill="url(#wood)"/>
      <rect x="150" y="70" width="200" height="96" rx="22" fill="url(#wood)"/>
      <rect x="150" y="84" width="200" height="14" fill="url(#brass)"/>
      <rect x="150" y="138" width="200" height="14" fill="url(#brass)"/>
      <rect x="126" y="62" width="30" height="112" rx="10" fill="#6E3A20"/>
      <rect x="344" y="62" width="30" height="112" rx="10" fill="#6E3A20"/>
    </g>
  </svg>
</body></html>
