[project]
name = "roundzero"
version = "0.1.0"
description = "Round Zero: pre-reviews design drafts against each client's remembered feedback (Hindsight memory)."
requires-python = ">=3.10"
dependencies = [
    "hindsight-client==0.10.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pillow>=10",
]

[project.optional-dependencies]
# Only needed to re-render data/drafts/*.png (rendered PNGs are committed).
drafts = ["playwright>=1.45"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roundzero*"]
